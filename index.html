<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sliding Puzzle</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #1a1a1a;
    color: #eee;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 10px;
    margin: 0;
    min-height: 100vh;
    box-sizing: border-box;
  }
  h1 { margin: 0 0 6px; font-size: 22px; }
  .sub { color: #888; font-size: 13px; margin-bottom: 18px; }
  .info { display: flex; gap: 20px; margin-bottom: 12px; font-size: 14px; color: #bbb; }
  .info b { color: #fff; }
  #board {
    display: grid;
    grid-template-columns: repeat(4, 70px);
    grid-template-rows: repeat(4, 70px);
    gap: 6px;
    background: #2a2a2a;
    padding: 6px;
    border-radius: 8px;
  }
  .tile {
    background: #3a7;
    color: #fff;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 600;
    cursor: pointer;
    user-select: none;
    transition: transform 0.08s;
  }
  .tile:active { transform: scale(0.95); }
  .empty { background: #2a2a2a; cursor: default; }
  .tile.correct { background: #4a8; }
  .controls { margin-top: 18px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  button {
    background: #3a7;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 5px;
    font-size: 14px;
    cursor: pointer;
  }
  button:hover { background: #4a8; }
  .msg {
    margin-top: 14px;
    min-height: 22px;
    color: #fc6;
    font-size: 15px;
  }
  .msg.win { color: #6f6; font-weight: 600; }
  .help {
    margin-top: 24px;
    color: #888;
    font-size: 13px;
    max-width: 320px;
    text-align: center;
    line-height: 1.5;
  }
  .help b { color: #ddd; }
</style>
</head>
<body>

<h1>Sliding Puzzle</h1>
<div class="sub">15-puzzle, web version</div>

<div class="info">
  <span>moves: <b id="moves">0</b></span>
  <span>misplaced: <b id="misplaced">0</b></span>
  <span>best: <b id="best">—</b></span>
</div>

<div id="board"></div>

<div class="msg" id="msg"></div>

<div class="controls">
  <button onclick="reshuffle()">reshuffle</button>
  <button onclick="hint()">hint</button>
</div>

<div class="help">
  click a tile next to the empty space to slide it.<br>
  on desktop you can also use <b>w / a / s / d</b>.<br>
  goal: get tiles 1..15 in order.
</div>

<script>
const SIZE = 4;
let tiles = [];
let empty = SIZE * SIZE - 1;
let moves = 0;
let won = false;

function init() {
  tiles = [];
  for (let i = 1; i < SIZE * SIZE; i++) tiles.push(i);
  tiles.push(0);
  empty = SIZE * SIZE - 1;
}

function neighborsOfEmpty() {
  const r = Math.floor(empty / SIZE);
  const c = empty % SIZE;
  const out = [];
  if (r > 0) out.push(empty - SIZE);
  if (r < SIZE - 1) out.push(empty + SIZE);
  if (c > 0) out.push(empty - 1);
  if (c < SIZE - 1) out.push(empty + 1);
  return out;
}

function shuffle(steps) {
  steps = steps || 200;
  let last = -1;
  for (let i = 0; i < steps; i++) {
    let choices = neighborsOfEmpty();
    if (last >= 0 && choices.includes(last) && choices.length > 1) {
      choices = choices.filter(x => x !== last);
    }
    const t = choices[Math.floor(Math.random() * choices.length)];
    last = empty;
    [tiles[empty], tiles[t]] = [tiles[t], tiles[empty]];
    empty = t;
  }
}

function isSolved() {
  for (let i = 0; i < SIZE * SIZE - 1; i++) {
    if (tiles[i] !== i + 1) return false;
  }
  return tiles[SIZE * SIZE - 1] === 0;
}

function misplaced() {
  let n = 0;
  for (let i = 0; i < SIZE * SIZE - 1; i++) {
    if (tiles[i] !== i + 1) n++;
  }
  return n;
}

function trySlide(idx) {
  // is idx adjacent to empty?
  const adj = neighborsOfEmpty();
  if (!adj.includes(idx)) return false;
  [tiles[empty], tiles[idx]] = [tiles[idx], tiles[empty]];
  empty = idx;
  return true;
}

function slideDir(dir) {
  // move the empty one cell that direction (matches CLI version)
  const r = Math.floor(empty / SIZE);
  const c = empty % SIZE;
  let target = -1;
  if (dir === 'w') { if (r === 0) return false; target = empty - SIZE; }
  else if (dir === 's') { if (r === SIZE - 1) return false; target = empty + SIZE; }
  else if (dir === 'a') { if (c === 0) return false; target = empty - 1; }
  else if (dir === 'd') { if (c === SIZE - 1) return false; target = empty + 1; }
  else return false;
  [tiles[empty], tiles[target]] = [tiles[target], tiles[empty]];
  empty = target;
  return true;
}

function render() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  tiles.forEach((v, i) => {
    const div = document.createElement('div');
    if (v === 0) {
      div.className = 'tile empty';
    } else {
      div.className = 'tile';
      if (v === i + 1) div.classList.add('correct');
      div.textContent = v;
      div.addEventListener('click', () => {
        if (won) return;
        if (trySlide(i)) {
          moves++;
          afterMove();
        }
      });
    }
    board.appendChild(div);
  });
  document.getElementById('moves').textContent = moves;
  document.getElementById('misplaced').textContent = misplaced();
  const best = localStorage.getItem('puzzle_best');
  document.getElementById('best').textContent = best || '—';
}

function afterMove() {
  document.getElementById('msg').textContent = '';
  document.getElementById('msg').className = 'msg';
  if (isSolved()) {
    won = true;
    const msg = document.getElementById('msg');
    msg.textContent = 'solved in ' + moves + ' moves!';
    msg.className = 'msg win';
    const best = parseInt(localStorage.getItem('puzzle_best') || '0');
    if (!best || moves < best) {
      localStorage.setItem('puzzle_best', String(moves));
      msg.textContent += ' (new best!)';
    }
  }
  render();
}

function reshuffle() {
  init();
  shuffle();
  moves = 0;
  won = false;
  document.getElementById('msg').textContent = '';
  render();
}

function hint() {
  const m = misplaced();
  const msg = document.getElementById('msg');
  msg.textContent = m + ' tiles still misplaced';
  msg.className = 'msg';
}

document.addEventListener('keydown', (e) => {
  if (won) return;
  const k = e.key.toLowerCase();
  if (['w', 'a', 's', 'd'].includes(k)) {
    if (slideDir(k)) {
      moves++;
      afterMove();
    }
  }
});

// init
init();
shuffle();
render();
</script>

</body>
</html>
